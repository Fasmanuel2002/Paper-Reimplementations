[project]
name = "paper-reimplementations"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manuel", email = "manuelfasruiz@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "tensorboard>=2.21.0",
    "torch",
    "tqdm",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cuda"
# Replace cu124 with cu121, cu126, or cpu depending on your setup
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
